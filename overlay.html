<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Matches the app's black-and-gold shell: a flat disc, no bevel, no glow
         except the one that signals state. */
      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .mic {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(217, 168, 58, 0.28);
        transition: box-shadow 300ms cubic-bezier(0.22, 1, 0.36, 1),
                    background 300ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .mic svg {
        width: 16px;
        height: 16px;
        fill: rgba(217, 168, 58, 0.45);
        transition: fill 300ms ease;
      }
      .mic.recording {
        background: #d9a83a;
        box-shadow: inset 0 0 0 1px #d9a83a, 0 0 18px rgba(217, 168, 58, 0.45);
        animation: pulse 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mic.recording svg {
        fill: #000;
      }
      .mic.transcribing {
        background: #000;
        box-shadow: inset 0 0 0 1px #d9a83a;
        animation: breathe 1.4s ease-in-out infinite;
      }
      .mic.transcribing svg {
        fill: #f0c65c;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.1); }
      }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
    </style>
  </head>
  <body>
    <div class="mic" id="mic">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
  </body>
</html>
